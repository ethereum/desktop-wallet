[package]
name = "edw-core"
version = "0.0.1"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true, features = ["derive"] }
strum = { workspace = true }

futures = { workspace = true }
tokio = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

uuid = { workspace = true }
reqwest = { workspace = true }

argon2 = { workspace = true }
bip32 = { workspace = true }
bip39 = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
kohaku-tornadocash = { workspace = true }
kohaku-tornadocash-keychain = { workspace = true }
kohaku-tornadocash-paymaster = { workspace = true }
kohaku-tornadocash-syncer = { workspace = true }
kohaku-userop-kit = { workspace = true }

alloy-primitives = { workspace = true, features = ["serde", "k256"] }
alloy-provider = { workspace = true, features = ["ccip-read"] }
alloy-signer = { workspace = true, features = ["eip712"] }
alloy-transport = { workspace = true }
alloy-eips = { workspace = true }
alloy-ens = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-network = { workspace = true }
alloy-consensus = { workspace = true }
alloy-dyn-abi = { workspace = true, features = ["eip712"] }
alloy-signer-local = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
alloy-node-bindings = { workspace = true }
alloy-sol-types = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
alloy-contract = { workspace = true }
kohaku-fork-kit = { workspace = true }

[lints]
workspace = true
