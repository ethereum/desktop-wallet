[workspace]
members = ["bin", "core", "cli"]
resolver = "2"

[workspace.dependencies]
edw-core = { path = "core" }
edw-cli = { path = "cli" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

reqwest = "*"
rpassword = "7"

inventory = "0.3.24"
postcard = { version = "1.1.3", default-features = false }
serde = "1.0.229"
uuid = { version = "1", features = ["v4", "serde"] }

thiserror = "2"
anyhow = "*"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

alloy-consensus = "2.3.0"
alloy-contract = "2.3.0"
alloy-eips = "2.3.0"
alloy-network = "2.3.0"
alloy-node-bindings = "2.3.0"
alloy-primitives = "1.6.1"
alloy-provider = "2.3.0"
alloy-rpc-types-eth = "2.3.0"
alloy-signer = "2.3.0"
alloy-signer-local = "2.3.0"
alloy-sol-types = "1.6.1"
alloy-transport = "2.3.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "warn"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
